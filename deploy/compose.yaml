# FrameGen: every service, started with one command (DESIGN.md section 9, D2).
#
#   docker compose -f deploy/compose.yaml up --build
#
# Open http://localhost:8080. The defaults below are for a developer's own machine only.
# Production (T-56) layers its own settings and secrets on top of this file.

name: framegen

x-backend-environment: &backend-environment
  FRAMEGEN_DB_HOST: postgres
  FRAMEGEN_DB_NAME: ${FRAMEGEN_DB_NAME:-framegen}
  FRAMEGEN_DB_USER: ${FRAMEGEN_DB_USER:-framegen}
  FRAMEGEN_DB_PASSWORD: ${FRAMEGEN_DB_PASSWORD:-framegen-dev}
  FRAMEGEN_S3_ENDPOINT_URL: http://storage:9000
  FRAMEGEN_S3_BUCKET: ${FRAMEGEN_S3_BUCKET:-framegen}
  FRAMEGEN_S3_ACCESS_KEY: ${FRAMEGEN_S3_ACCESS_KEY:-framegen}
  FRAMEGEN_S3_SECRET_KEY: ${FRAMEGEN_S3_SECRET_KEY:-framegen-dev-secret}

# The backend image is built once, by the api service; storage-init and worker reuse it.
x-backend-image: &backend-image
  image: framegen-backend:local
  pull_policy: never

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${FRAMEGEN_DB_USER:-framegen}
      POSTGRES_PASSWORD: ${FRAMEGEN_DB_PASSWORD:-framegen-dev}
      POSTGRES_DB: ${FRAMEGEN_DB_NAME:-framegen}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      # Over TCP: the socket also answers during first-start initialisation, before the real
      # server is listening for other containers.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # S3-compatible file storage (D9).
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${FRAMEGEN_S3_ACCESS_KEY:-framegen}
      RUSTFS_SECRET_KEY: ${FRAMEGEN_S3_SECRET_KEY:-framegen-dev-secret}
      RUSTFS_ADDRESS: :9000
    volumes:
      - storage-data:/data
    ports:
      - 127.0.0.1:9000:9000
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://localhost:9000/health || exit 1]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Creates the bucket on first start, then exits.
  storage-init:
    <<: *backend-image
    environment: *backend-environment
    command: [framegen-storage-init]
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: framegen-backend:local
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    # Liveness only, so a database or storage outage does not take the web app down with
    # it. Whether the API can reach them is GET /internal/health/ready (not public; CI uses it).
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    <<: *backend-image
    environment: *backend-environment
    command: [framegen-worker]
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Internal only: writes PSD text layers (D8).
  psd-writer:
    build:
      context: ..
      dockerfile: services/psd-writer/Dockerfile
    image: framegen-psd-writer:local
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:8090/health]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The web app and the public entrance: serves the app and forwards /v1 to the API.
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: framegen-web:local
    environment:
      # Read by web/Caddyfile. In production, the domain; Caddy then gets HTTPS itself (T-56).
      FRAMEGEN_SITE_ADDRESS: ${FRAMEGEN_SITE_ADDRESS:-:80}
    ports:
      - 127.0.0.1:8080:80
    volumes:
      # Caddy keeps its HTTPS certificates here (production, T-56).
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # Caddy's admin endpoint, local to the container; works whatever the site address is.
      # 127.0.0.1, not localhost: localhost can resolve to ::1, where the admin endpoint is not.
      test: [CMD, wget, -qO-, http://127.0.0.1:2019/config/]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
  caddy-data:
  caddy-config:
