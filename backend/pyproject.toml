[project]
name = "framegen"
version = "0.1.0"
description = "FrameGen backend: API and workers"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.111",
    "fastapi>=0.143.0",
    "pillow>=12.0.0",
    "procrastinate[psycopg]==3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
framegen-worker = "framegen.worker.main:main"
framegen-openapi = "framegen.api.openapi:main"
framegen-storage-init = "framegen.storage.setup:main"
framegen-migrate = "framegen.db.migrate:main"
framegen-spec-schema = "framegen.spec.schema:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.111",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["framegen", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
