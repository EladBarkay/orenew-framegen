name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  node:
    name: Web, SDK and psd-writer (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: SDK matches the API
        run: |
          (cd backend && uv sync --locked)
          pnpm sdk:generate
          pnpm exec prettier --check sdk/typescript/src/index.ts
          git diff --exit-code -- sdk/typescript/openapi.json sdk/typescript/src/schema.ts \
            || { echo "::error::The SDK is out of date. Run 'pnpm sdk:generate' and commit the result."; exit 1; }
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  compose:
    name: Docker Compose (all services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose -f deploy/compose.yaml build
      - name: Start everything
        run: docker compose -f deploy/compose.yaml up --detach --wait --wait-timeout 180
      - name: Smoke test through the web entrance
        run: |
          curl --fail --silent --show-error http://localhost:8080/v1/health/ready
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs
      - name: Stop
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes
