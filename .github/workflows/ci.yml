name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: framegen
          POSTGRES_PASSWORD: framegen-dev
          POSTGRES_DB: framegen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U framegen"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      storage:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: framegen
          RUSTFS_SECRET_KEY: framegen-dev-secret
          RUSTFS_ADDRESS: :9000
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health || exit 1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Chromium for the renderer tests (the version Playwright is pinned to)
        run: uv run playwright install --with-deps --only-shell chromium
      - name: Tests (including the Postgres, storage and Chromium ones)
        run: uv run pytest
        env:
          FRAMEGEN_TEST_POSTGRES: "1"
          FRAMEGEN_TEST_STORAGE: "1"
          FRAMEGEN_TEST_CHROMIUM: "1"

  node:
    name: Web, SDK and psd-writer (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: SDK matches the API
        run: |
          (cd backend && uv sync --locked)
          pnpm sdk:generate
          pnpm exec prettier --check sdk/typescript/src/index.ts
          git diff --exit-code -- sdk/typescript/openapi.json sdk/typescript/src/schema.ts \
            || { echo "::error::The SDK is out of date. Run 'pnpm sdk:generate' and commit the result."; exit 1; }
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  compose:
    name: Docker Compose (all services)
    runs-on: ubuntu-latest
    env:
      # Not the default, so the port variable and the links that follow it are tested.
      FRAMEGEN_WEB_PORT: 8081
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose -f deploy/compose.yaml build
      - name: Start everything
        run: docker compose -f deploy/compose.yaml up --detach --wait --wait-timeout 180
      - name: Smoke test
        run: |
          # Readiness, inside the deployment: the API reaches the database and storage.
          docker compose -f deploy/compose.yaml exec -T api python -c \
            "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/internal/health/ready').read().decode())"
          # Through the public entrance: the web app and the API.
          curl --fail --silent --show-error --output /dev/null http://localhost:$FRAMEGEN_WEB_PORT/
          curl --fail --silent --show-error http://localhost:$FRAMEGEN_WEB_PORT/v1/health
          # Readiness must not be reachable from outside.
          if curl --silent http://localhost:$FRAMEGEN_WEB_PORT/internal/health/ready | grep -q '"checks"'; then
            echo "::error::readiness is reachable through the public entrance"; exit 1
          fi
      - name: Upload and download a file through the public entrance
        run: deploy/smoke-upload.sh http://localhost:$FRAMEGEN_WEB_PORT
      - name: Start a demo job and follow it to the end through the public entrance
        run: deploy/smoke-job.sh http://localhost:$FRAMEGEN_WEB_PORT
      - name: The worker renders a frame in its Chromium
        run: docker compose -f deploy/compose.yaml exec -T worker framegen-render-check
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs
      - name: Stop
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes
